name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.16.5
      - run: ruff format --check .
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - name: cpa-status tests and shared code check
        run: |
          cmp cpa.py cpa-status/cpa.py
          python -m unittest discover -s cpa-status/tests -v

  hermes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (plugin.yaml requires_hermes) and the latest release.
        hermes: ["v0.21.7", "v0.22.5"]
    name: hermes ${{ matrix.hermes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plugin
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-agent
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.12.13"
      # Install from Hermes' own uv.lock, as Hermes CI does. Plain pip ignores
      # [tool.uv] override-dependencies, which v0.22.5 needs (Pillow 13 vs
      # browser-harness pinning pillow 12.3.0). Hermes needs Python >= 3.14.
      - working-directory: hermes-agent
        run: uv sync --locked --python 3.14
      - name: Integration tests
        working-directory: plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: PYTHONPATH="$GITHUB_WORKSPACE/hermes-agent" "$GITHUB_WORKSPACE/hermes-agent/.venv/bin/python" -m unittest discover -s tests -v
      - name: cpa-status tests
        working-directory: plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: PYTHONPATH="$GITHUB_WORKSPACE/hermes-agent" "$GITHUB_WORKSPACE/hermes-agent/.venv/bin/python" -m unittest discover -s cpa-status/tests -v
      - name: Plugin doctor and validate
        working-directory: plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          "$GITHUB_WORKSPACE/hermes-agent/.venv/bin/hermes" plugins doctor . --ci
          "$GITHUB_WORKSPACE/hermes-agent/.venv/bin/hermes" plugins validate .
          "$GITHUB_WORKSPACE/hermes-agent/.venv/bin/hermes" plugins doctor ./cpa-status --ci
          "$GITHUB_WORKSPACE/hermes-agent/.venv/bin/hermes" plugins validate ./cpa-status
