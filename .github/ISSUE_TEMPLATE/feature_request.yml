name: Feature request
description: Propose a change that is not a bug or a new provider.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        What you would change. Proposals that add management endpoints, background
        polling or write calls to CPA conflict with the safety rules in CONTRIBUTING.md;
        say why the change still keeps them.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
